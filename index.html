<!DOCTYPE html>
<html lang="hy">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Գուրգեն և Շուշան - 25 ապրիլի, 2026</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <style>
      @font-face {
        font-family: 'PingAmL';
        src: url('./PingAmL-Regular.otf') format('opentype');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: 'PingAmL';
        src: url('./PingAmL-Medium.otf') format('opentype');
        font-weight: 500;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: 'PingAmL';
        src: url('./PingAmL-Bold.otf') format('opentype');
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: 'PingAmL';
        src: url('./PingAmL-Black.otf') format('opentype');
        font-weight: 900;
        font-style: normal;
        font-display: swap;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
        scroll-snap-type: y mandatory;
      }

      body {
        font-family: 'PingAmL', Georgia, serif;
        background-color: #fafafa;
        color: #2a2a2a;
        line-height: 1.6;
        font-weight: 300;
        margin: 0;
      }

      section {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 2rem;
        position: relative;
        scroll-snap-align: start;
      }

      .hero {
        position: relative;
        overflow: hidden;
        background-color: transparent;
        justify-content: flex-end;
        padding-bottom: 6rem;
      }

      .hero-top-left,
      .hero-bottom-left {
        position: absolute;
        left: clamp(1rem, 3vw, 2.5rem);
        z-index: 1;
        color: #fff;
        line-height: 1.4;
      }

      .hero-top-left {
        top: clamp(1rem, 3vw, 2.5rem);
        font-size: clamp(1.8rem, 4.8vw, 4rem);
        font-weight: 700;
      }

      .hero-bottom-left {
        bottom: clamp(1rem, 3vw, 2.5rem);
        font-size: clamp(1rem, 2vw, 2rem);
        font-weight: 400;
        opacity: 0.95;
        max-width: 50vw;
      }

      .hero-bg {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: url('./banner.webp') center/cover no-repeat;
      }

      .hero-title {
        position: relative;
        z-index: 1;
        text-align: center;
        color: #fff;
        animation: fadeUp 1.2s ease-out;
      }

      .hero-title h1 {
        font-size: clamp(3rem, 10vw, 7rem);
        font-weight: 300;
        font-style: italic;
        letter-spacing: 0.05em;
        margin-bottom: 1.5rem;
      }

      .hero-title p {
        font-family: 'PingAmL', sans-serif;
        font-size: clamp(0.75rem, 2vw, 1rem);
        font-weight: 300;
        letter-spacing: 0.4em;
        text-transform: uppercase;
        opacity: 0.85;
      }

      .scroll-indicator {
        position: absolute;
        bottom: 2rem;
        left: 50%;
        transform: translateX(-50%);
        color: #fff;
        font-family: 'PingAmL', sans-serif;
        font-size: 0.65rem;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        opacity: 0.6;
        animation: bounce 2s infinite;
      }

      .intro {
        background-color: #fafafa;
        padding: 0;
        min-height: 100vh;
      }

      .intro-content {
        max-width: 900px;
        margin: 0 auto;
        text-align: center;
        padding: 4rem 2rem;
      }

      .intro h2 {
        font-size: clamp(2rem, 5vw, 3.5rem);
        font-weight: 300;
        font-style: italic;
        margin-bottom: 2rem;
        color: #2a2a2a;
      }

      .intro p {
        font-size: clamp(1.1rem, 2vw, 1.4rem);
        color: #555;
        margin-bottom: 1.2rem;
        line-height: 1.9;
        font-weight: 400;
      }

      .photo-grid {
        display: grid;
        grid-template-columns: 2fr 1fr;
        grid-template-rows: 300px 300px;
        gap: 0;
        width: 100%;
        margin-top: 3rem;
      }

      .photo-grid img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: grayscale(100%);
      }

      .photo-main {
        grid-row: 1 / 3;
      }

      .venue {
        background: radial-gradient(circle at 12% 15%, rgba(255, 255, 255, 0.85), transparent 46%),
          radial-gradient(circle at 88% 80%, rgba(40, 40, 40, 0.12), transparent 44%),
          linear-gradient(140deg, #f7f7f7 0%, #ececec 55%, #e1e1e1 100%);
        text-align: center;
        padding: 0;
        min-height: 100vh;
        overflow: hidden;
      }

      .venue-content {
        width: 100%;
        height: 100vh;
        height: 100svh;
        max-height: 100vh;
        padding: clamp(1rem, 3.5vh, 2.25rem) clamp(1rem, 2.5vw, 2rem);
        display: grid;
        grid-template-rows: 1fr;
        align-content: center;
      }

      .venue-layout {
        display: grid;
        grid-template-columns: 1fr;
        grid-template-areas:
          'qa'
          'photo'
          'map';
        grid-template-rows: auto minmax(0, 1fr) minmax(0, 0.9fr);
        width: 100%;
        height: 100%;
        gap: clamp(0.9rem, 1.8vh, 1.25rem);
        align-items: stretch;
        text-align: left;
        min-height: 0;
      }

      .venue-qa {
        grid-area: qa;
        background: rgba(255, 255, 255, 0.86);
        border: 1px solid rgba(0, 0, 0, 0.2);
        border-radius: 22px;
        padding: clamp(1.2rem, 2.7vw, 2.2rem);
        backdrop-filter: blur(6px);
        display: flex;
        flex-direction: column;
        justify-content: center;
        opacity: 0;
        transform: translateY(28px) scale(0.98);
        animation: venueReveal 0.85s ease-out forwards;
      }

      .qa-item {
        padding: 0.85rem 0;
        border-bottom: 1px solid rgba(0, 0, 0, 0.15);
        opacity: 0;
        transform: translateX(-14px);
        animation: qaSlide 0.7s ease-out forwards;
      }

      .qa-item:nth-child(1) {
        animation-delay: 0.22s;
      }

      .qa-item:nth-child(2) {
        animation-delay: 0.34s;
      }

      .qa-item:last-child {
        border-bottom: none;
      }

      .qa-q {
        font-size: 0.95rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #555;
        margin-bottom: 0.35rem;
      }

      .qa-a {
        font-size: clamp(1.3rem, 2.8vw, 1.95rem);
        color: #111;
        font-weight: 500;
        line-height: 1.25;
      }

      .venue-photo {
        grid-area: photo;
        border-radius: 20px;
        overflow: hidden;
        border: 1px solid rgba(0, 0, 0, 0.2);
        min-height: clamp(260px, 48vh, 520px);
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.12);
        opacity: 0;
        transform: translateY(30px);
        animation: venueReveal 0.95s ease-out forwards;
        animation-delay: 0.2s;
        height: 100%;
      }

      .venue-photo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform: scale(1.02);
      }

      .venue-map {
        grid-area: map;
        border-radius: 20px;
        overflow: hidden;
        border: 1px solid rgba(0, 0, 0, 0.2);
        min-height: clamp(180px, 26vh, 300px);
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.12);
        opacity: 0;
        transform: translateY(30px);
        animation: venueReveal 0.95s ease-out forwards;
        animation-delay: 0.32s;
        height: 100%;
      }

      .venue-map iframe {
        width: 100%;
        height: 100%;
        border: 0;
      }

      .dress-code {
        background-color: #2a2a2a;
        color: #fff;
        text-align: center;
        position: relative;
        overflow: hidden;
      }

      .dress-code-video {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 60% center;
        /* filter: grayscale(100%) brightness(0.7); */
      }

      .dress-code-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(20, 20, 20, 0.6);
        backdrop-filter: blur(2px);
        -webkit-backdrop-filter: blur(2px);
      }

      .dress-code-content {
        position: relative;
        z-index: 1;
      }

      .dress-code h2 {
        font-size: clamp(2rem, 5vw, 3.5rem);
        font-weight: 300;
        font-style: italic;
        margin-bottom: 1.5rem;
      }

      .dress-code p {
        font-size: clamp(1.2rem, 2.5vw, 1.6rem);
        font-style: italic;
        font-weight: 400;
        opacity: 0.9;
        letter-spacing: 0.05em;
      }

      .rsvp {
        background-color: #fafafa;
        padding: 0;
        text-align: center;
      }

      .rsvp-form {
        width: 100%;
        max-width: 100%;
      }

      .footer {
        padding: 1.5rem;
        text-align: center;
        font-family: 'PingAmL', sans-serif;
        font-size: 0.7rem;
        font-weight: 400;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #555;
        background-color: #eaeaea;
      }

      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes bounce {
        0%,
        20%,
        50%,
        80%,
        100% {
          transform: translateX(-50%) translateY(0);
        }
        40% {
          transform: translateX(-50%) translateY(-10px);
        }
        60% {
          transform: translateX(-50%) translateY(-5px);
        }
      }

      @keyframes venueReveal {
        from {
          opacity: 0;
          transform: translateY(28px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes qaSlide {
        from {
          opacity: 0;
          transform: translateX(-14px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      @media (max-width: 768px) {
        .hero-top-left {
          font-size: clamp(2.1rem, 8vw, 3.3rem);
        }

        .hero-bottom-left {
          font-size: clamp(1.3rem, 4.8vw, 2.4rem);
          max-width: 78vw;
          line-height: 1.35;
        }

        .hero {
          background-color: #111;
        }

        .hero-bg {
          background: url('./banner.webp') center/contain no-repeat;
        }

        .photo-grid {
          grid-template-columns: 1fr 1fr;
          grid-template-rows: 250px 200px;
        }

        .photo-main {
          grid-column: 1 / -1;
          grid-row: 1;
        }

        .photo-grid img:not(.photo-main) {
          height: 100%;
        }

        .venue-layout {
          grid-template-columns: 1fr;
          grid-template-rows: auto minmax(0, 1fr) minmax(0, 0.9fr);
          gap: 0.9rem;
          width: 100%;
        }

        .venue-content {
          height: 100vh;
          height: 100svh;
          max-height: 100vh;
          padding: clamp(0.9rem, 2.8vh, 1.2rem) 1rem;
        }

        .venue-qa {
          padding: 1rem;
        }

        .qa-item {
          padding: 0.6rem 0;
        }

        .qa-a {
          font-size: clamp(1.2rem, 6vw, 1.55rem);
        }

        .venue-photo {
          min-height: 0;
        }

        .venue-map {
          min-height: 0;
        }

        .dress-code-content {
          padding: 0 1.25rem;
        }

        .intro-content {
          padding: 3rem 2rem;
        }
      }

      @media (min-width: 900px) {
        .venue-layout {
          grid-template-columns: minmax(320px, 0.95fr) minmax(460px, 1.25fr);
          grid-template-areas:
            'qa photo'
            'map photo';
          grid-template-rows: minmax(0, 1fr) minmax(0, 1fr);
          gap: clamp(1rem, 2vw, 2rem);
        }

        .venue-qa,
        .venue-map,
        .venue-photo {
          min-height: 0;
          height: 100%;
        }
      }

      @media (min-width: 1200px) {
        .qa-a {
          font-size: clamp(1.6rem, 2.1vw, 2.2rem);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .venue-qa,
        .venue-photo,
        .venue-map,
        .qa-item {
          animation: none;
          opacity: 1;
          transform: none;
        }
      }

      @media (max-width: 768px) and (orientation: portrait) {
        .hero-bg {
          background: url('./banner-vertical.webp') center/cover no-repeat;
        }

        .hero-top-left {
          top: clamp(6.2rem, 18vh, 10rem);
          left: 50%;
          transform: translateX(-50%);
          text-align: center;
          font-size: clamp(1.55rem, 6.2vw, 2.4rem);
          width: 100%;
          line-height: 1.25;
        }

        .hero-bottom-left {
          top: clamp(13.5rem, 34vw, 18rem);
          bottom: auto;
          left: 50%;
          transform: translateX(-50%);
          text-align: center;
          font-size: clamp(0.95rem, 3.8vw, 1.35rem);
          width: 100%;
          line-height: 1.2;
        }
      }
    </style>
  </head>
  <body>
    <section class="hero">
      <div class="hero-bg"></div>
      <p class="hero-top-left">Մենք ամուսնանում ենք</p>
      <p class="hero-bottom-left">
        ուրախ կլինենք կիսել մեր սերը և ուրախությունը ամենասիրելիների հետ
      </p>
    </section>

    <section class="venue">
      <div class="venue-content">
        <div class="venue-layout">
          <div class="venue-qa">
            <div class="qa-item">
              <p class="qa-q">Ե՞րբ</p>
              <p class="qa-a">Ապրիլ 25, 17:30</p>
            </div>
            <div class="qa-item">
              <p class="qa-q">Որտե՞ղ</p>
              <p class="qa-a">Օհանա, Երևան</p>
            </div>
          </div>
          <div class="venue-photo">
            <img src="./venue.webp" alt="Ohana venue" loading="lazy" />
          </div>
          <div class="venue-map">
            <iframe
              src="https://yandex.com/map-widget/v1/-/CPEuV03b"
              allowfullscreen
              loading="lazy"
              title="Ohana venue map"
            ></iframe>
          </div>
        </div>
      </div>
    </section>

    <section class="dress-code">
      <video
        class="dress-code-video"
        autoplay
        muted
        loop
        playsinline
        preload="none"
        poster="r1.webp"
      >
        <source src="dance-web.webm" type="video/webm" />
      </video>
      <div class="dress-code-overlay"></div>
      <div class="dress-code-content">
        <p>պատրաստ եղեք ամբողջ երեկո պարելու</p>
      </div>
    </section>

    <section class="rsvp">
      <div class="rsvp-form">
        <script src="https://wmzebtjb.formester.com/widget/standard.js" type="module"></script>
        <formester-standard-form
          set-auto-height="true"
          height="100%"
          width="100%"
          id="D4EVvHaa9"
          url="https://wmzebtjb.formester.com/f/D4EVvHaa9"
        ></formester-standard-form>
      </div>
    </section>
  </body>
</html>
